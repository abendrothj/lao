name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Build plugins
        shell: bash
        run: bash scripts/build-plugins.sh

      - name: Build CLI (release)
        run: cargo build --release --bin lao-cli --locked

      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="lao-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGING}/bin" "${STAGING}/plugins"
          cp target/release/lao-cli "${STAGING}/bin/"
          find plugins -path '*/target/release/lib*' \( -name '*.so' -o -name '*.dylib' \) -print | while read -r lib; do
            plugin_name="$(echo "$lib" | cut -d/ -f2)"
            mkdir -p "${STAGING}/plugins/${plugin_name}"
            cp "$lib" "${STAGING}/plugins/${plugin_name}/"
          done
          cp README.md lao.toml.example "${STAGING}/"
          tar czf "lao-${VERSION}-${{ matrix.target }}.tar.gz" "${STAGING}"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: lao-*-${{ matrix.target }}.*
